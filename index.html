<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cardápio · Isabela</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#EEF5F1;--surface:#FFF;--surf2:#F5FAF7;
  --verde:#287A50;--verde-lt:#E3F2EB;--verde-dk:#1B5C3A;
  --paprika:#C44328;--paprika-lt:#FCECEA;
  --ouro:#C47A0A;--ouro-lt:#FDF3E0;
  --lilas:#6E4FC0;--lilas-lt:#EEE9F7;
  --azul:#1B5E8A;--azul-lt:#E4EFF8;
  --ink:#181818;--ink2:#3C3C3C;--muted:#717B82;
  --border:#DDE6E0;--nav-h:66px;--r:14px;--rsm:9px
}
html,body{height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;background:var(--bg)}
#content{flex:1;overflow-y:auto;padding-bottom:calc(var(--nav-h) + 8px)}

/* HEADER */
.hdr{background:var(--verde);color:#fff;padding:14px 18px 12px;position:sticky;top:0;z-index:20}
.hdr-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.hdr-name{font-size:17px;font-weight:800;letter-spacing:-0.3px}
.hdr-sub{font-size:12px;opacity:.75;margin-top:1px}
.hdr-badge{background:rgba(255,255,255,.22);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700}
.hdr.paprika{background:var(--paprika)}
.hdr.azul{background:var(--azul)}
.hdr.lilas{background:var(--lilas)}

/* DAY SELECTOR */
.day-strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.day-strip::-webkit-scrollbar{display:none}
.day-btn{flex-shrink:0;padding:6px 14px;border-radius:20px;border:none;background:rgba(255,255,255,.22);color:#fff;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap}
.day-btn.active{background:#fff;color:var(--verde)}
.judo-dot::after{content:'🥋';font-size:9px;margin-left:3px}

/* DAY HERO */
.day-hero{padding:14px 18px 4px}
.day-hero-name{font-size:21px;font-weight:800;color:var(--ink);letter-spacing:-.5px}
.day-hero-sub{font-size:13px;color:var(--muted);margin-top:2px}
.judo-chip{display:inline-flex;align-items:center;gap:5px;background:var(--paprika-lt);color:var(--paprika);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700;margin-top:6px}

/* SECTION LABEL */
.sec-lbl{font-size:10px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);padding:14px 18px 4px}

/* MEAL CARD */
.mc{margin:5px 14px;background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.mc-hdr{display:flex;align-items:center;gap:0;cursor:pointer;user-select:none}
.mc-bar{width:4px;flex-shrink:0;align-self:stretch;border-radius:2px 0 0 2px}
.mc-ico{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:22px;margin:12px 10px 12px 12px;border-radius:11px;flex-shrink:0}
.mc-info{flex:1;min-width:0}
.mc-time{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.3px}
.mc-name{font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-chevron{margin-right:14px;font-size:18px;color:var(--muted);transition:transform .2s;flex-shrink:0}
.mc.open .mc-chevron{transform:rotate(180deg)}

/* Per meal type */
.cafe .mc-bar{background:var(--ouro)}.cafe .mc-ico{background:var(--ouro-lt)}
.lancheira .mc-bar{background:var(--verde)}.lancheira .mc-ico{background:var(--verde-lt)}
.almoco .mc-bar{background:var(--paprika)}.almoco .mc-ico{background:var(--paprika-lt)}
.tarde .mc-bar{background:var(--lilas)}.tarde .mc-ico{background:var(--lilas-lt)}
.jantar .mc-bar{background:var(--azul)}.jantar .mc-ico{background:var(--azul-lt)}

.mc-body{display:none;border-top:1px solid var(--border);padding:12px 14px}
.mc.open .mc-body{display:block}

/* FOOD LIST */
.food-list{list-style:none;margin-bottom:10px}
.food-item{display:flex;align-items:baseline;gap:8px;padding:5px 0;border-bottom:1px solid var(--surf2);font-size:14px;color:var(--ink2)}
.food-item:last-child{border-bottom:none}
.food-bullet{color:var(--muted);font-size:16px;flex-shrink:0}
.food-qty{color:var(--muted);font-size:12px;margin-left:auto;padding-left:8px;white-space:nowrap}

/* SALADA SUGGESTION */
.salada-box{background:var(--verde-lt);border-radius:var(--rsm);padding:8px 10px;margin-bottom:10px;font-size:13px;color:var(--verde-dk)}
.salada-box strong{font-size:10px;letter-spacing:.5px;text-transform:uppercase;display:block;margin-bottom:2px}

/* SUBS TOGGLE */
.subs-toggle{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--verde);cursor:pointer;padding:6px 0;border:none;background:none;width:100%;text-align:left}
.subs-panel{display:none;margin-top:6px}
.subs-panel.open{display:block}
.sub-group{margin-bottom:8px}
.sub-lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:4px}
.sub-item{font-size:13px;color:var(--ink2);padding:3px 0 3px 10px;border-left:2px solid var(--verde-lt);margin-bottom:3px;line-height:1.4}

/* DICA */
.dica{background:var(--ouro-lt);border-radius:var(--rsm);padding:10px 12px;margin-top:8px}
.dica-lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--ouro);margin-bottom:3px}
.dica-txt{font-size:13px;color:var(--ink2);line-height:1.5}

/* === RECEITAS === */
.rec-card{margin:6px 14px;background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.rec-hdr{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.rec-emoji{font-size:32px;flex-shrink:0}
.rec-title{font-size:16px;font-weight:800;color:var(--ink);flex:1}
.rec-chevron{font-size:18px;color:var(--muted);transition:transform .2s}
.rec-card.open .rec-chevron{transform:rotate(180deg)}
.rec-body{display:none;padding:0 16px 16px}
.rec-card.open .rec-body{display:block}
.rec-sec{margin-top:10px}
.rec-sec-lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:6px}
.rec-list{padding-left:16px}
.rec-list li{font-size:14px;color:var(--ink2);margin-bottom:5px;line-height:1.4}
.rec-step{display:flex;gap:10px;margin-bottom:8px}
.step-num{width:22px;height:22px;border-radius:50%;background:var(--verde);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.step-txt{font-size:14px;color:var(--ink2);line-height:1.45;flex:1}
.rec-storage{background:var(--verde-lt);border-radius:var(--rsm);padding:9px 11px;margin-top:10px;font-size:13px;color:var(--verde-dk);line-height:1.5}
.rec-storage strong{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.rec-dica{background:var(--ouro-lt);border-radius:var(--rsm);padding:9px 11px;margin-top:8px;font-size:13px;color:var(--ink2);line-height:1.5}

/* === ÁGUA === */
.agua-body{padding:16px}
.agua-toggle{display:flex;gap:8px;margin-bottom:20px}
.agua-btn{flex:1;padding:10px;border:2px solid var(--border);border-radius:var(--rsm);background:var(--surface);font-size:13px;font-weight:700;cursor:pointer;text-align:center;color:var(--muted);transition:all .15s}
.agua-btn.active{border-color:var(--azul);background:var(--azul-lt);color:var(--azul)}
.agua-goal{text-align:center;margin-bottom:20px}
.agua-num{font-size:48px;font-weight:900;color:var(--azul);letter-spacing:-3px;line-height:1}
.agua-unit{font-size:18px;font-weight:400;color:var(--muted)}
.agua-lbl{font-size:13px;color:var(--muted);margin-top:4px}
.glasses-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}
.glass{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:transform .1s}
.glass:active{transform:scale(.88)}
.glass-ico{font-size:36px;transition:opacity .2s}
.glass.empty .glass-ico{opacity:.2}
.glass-ml{font-size:10px;color:var(--muted);font-weight:600}
.agua-bar-wrap{background:var(--border);border-radius:8px;height:8px;overflow:hidden;margin-bottom:8px}
.agua-bar{height:100%;background:linear-gradient(90deg,#90CAF9,var(--azul));border-radius:8px;transition:width .3s}
.agua-tip{background:var(--azul-lt);border-radius:var(--rsm);padding:10px 12px;font-size:13px;color:var(--azul);line-height:1.5}
.agua-counter{text-align:center;font-size:13px;color:var(--muted);margin-bottom:10px}
.agua-reset{display:block;margin:12px auto 0;padding:8px 20px;border:1.5px solid var(--border);border-radius:20px;background:none;font-size:13px;color:var(--muted);cursor:pointer}

/* === SUPLEMENTOS === */
.supp-body{padding:16px}
.supp-alert{background:var(--paprika-lt);border-radius:var(--rsm);padding:11px 13px;font-size:13px;color:var(--paprika);line-height:1.5;margin-bottom:16px}
.supp-alert strong{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.timeline{display:flex;flex-direction:column;gap:0;margin-bottom:20px}
.tl-row{display:flex;gap:12px}
.tl-time-col{display:flex;flex-direction:column;align-items:center;width:52px;flex-shrink:0}
.tl-time{font-size:12px;font-weight:800;color:var(--verde);letter-spacing:.2px}
.tl-line{flex:1;width:2px;background:var(--border);margin:4px 0;min-height:12px}
.tl-cards{flex:1;padding-bottom:10px}
.supp-card{background:var(--surface);border-radius:var(--rsm);padding:10px 12px;margin-bottom:6px;border-left:3px solid var(--verde);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.supp-card.omega{border-left-color:var(--azul)}
.supp-card.ferro{border-left-color:var(--paprika)}
.sc-name{font-size:14px;font-weight:700;color:var(--ink)}
.sc-detail{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.supp-list-card{background:var(--surface);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.supp-list-title{font-size:13px;font-weight:800;color:var(--ink);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.supp-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--surf2);font-size:13px}
.supp-row:last-child{border-bottom:none}
.sr-name{color:var(--ink2)}
.sr-dose{font-weight:700;color:var(--verde)}
.ferro-checker{background:var(--paprika-lt);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.ferro-checker h3{font-size:14px;font-weight:800;color:var(--paprika);margin-bottom:8px}
.ferro-checker p{font-size:13px;color:var(--ink2);line-height:1.5;margin-bottom:10px}
.ferro-days{display:flex;flex-wrap:wrap;gap:6px}
.fd{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;background:var(--surface);color:var(--muted);border:1.5px solid var(--border)}
.fd.on{background:var(--paprika);color:#fff;border-color:var(--paprika)}

/* === REGRAS === */
.regras-body{padding:0 14px}
.regra-card{background:var(--surface);border-radius:var(--r);padding:15px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.regra-title{font-size:15px;font-weight:800;color:var(--ink);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.regra-list{list-style:none}
.regra-list li{font-size:13px;color:var(--ink2);padding:5px 0 5px 12px;border-left:3px solid var(--verde-lt);margin-bottom:4px;line-height:1.45}
.regra-list li strong{color:var(--verde-dk)}
.doce-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:4px}
.doce-day{background:var(--surf2);border-radius:var(--rsm);padding:10px 8px;text-align:center}
.doce-day-name{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.doce-day-txt{font-size:12px;color:var(--ink2);line-height:1.4}
.horario-grid{display:flex;flex-direction:column;gap:6px}
.hor-row{display:flex;align-items:center;gap:10px}
.hor-time{font-size:13px;font-weight:800;color:var(--verde);width:50px;flex-shrink:0}
.hor-bar{flex:1;height:2px;background:var(--border)}
.hor-name{font-size:13px;color:var(--ink2);font-weight:600}
.hor-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* === BOTTOM NAV === */
#bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom,0px)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px 6px;border:none;background:none;cursor:pointer;color:var(--muted);transition:color .15s}
.nb.active{color:var(--verde)}
.nb-ico{font-size:22px;line-height:1}
.nb-lbl{font-size:10px;font-weight:700;margin-top:2px;letter-spacing:.2px}

/* TABS */
.tab{display:none}.tab.active{display:block}

/* MISC */
.obs-box{margin:6px 14px;background:var(--surf2);border-radius:var(--rsm);padding:10px 12px;font-size:13px;color:var(--muted);border-left:3px solid var(--border)}
</style>
</head>
<body>
<div id="app">
<div id="content">

<!-- TAB CARDAPIO -->
<div class="tab active" id="tab-cardapio">
  <div class="hdr" id="hdr-cardapio">
    <div class="hdr-row">
      <div><div class="hdr-name">Cardápio da Isabela 🌿</div><div class="hdr-sub">Plano alimentar semanal</div></div>
      <div class="hdr-badge" id="judo-badge"></div>
    </div>
    <div class="day-strip" id="day-strip"></div>
  </div>
  <div id="day-hero"></div>
  <div id="meals-container"></div>
</div>

<!-- TAB RECEITAS -->
<div class="tab" id="tab-receitas">
  <div class="hdr"><div class="hdr-row"><div><div class="hdr-name">🍳 Receitas do Plano</div><div class="hdr-sub">Modo de preparo completo</div></div></div></div>
  <div class="sec-lbl">3 receitas incluídas no plano</div>
  <div id="receitas-container"></div>
</div>

<!-- TAB ÁGUA -->
<div class="tab" id="tab-agua">
  <div class="hdr azul"><div class="hdr-row"><div><div class="hdr-name">💧 Hidratação</div><div class="hdr-sub">Meta diária de água</div></div></div></div>
  <div class="agua-body" id="agua-body"></div>
</div>

<!-- TAB SUPLEMENTOS -->
<div class="tab" id="tab-suplementos">
  <div class="hdr paprika"><div class="hdr-row"><div><div class="hdr-name">💊 Suplementos</div><div class="hdr-sub">Horários e posologia</div></div></div></div>
  <div class="supp-body" id="supp-body"></div>
</div>

<!-- TAB REGRAS -->
<div class="tab" id="tab-regras">
  <div class="hdr lilas"><div class="hdr-row"><div><div class="hdr-name">📋 Guia Rápido</div><div class="hdr-sub">Regras e orientações diárias</div></div></div></div>
  <div class="regras-body" style="padding-top:12px" id="regras-body"></div>
</div>

</div><!-- end content -->

<nav id="bnav">
  <button class="nb active" onclick="switchTab('cardapio',this)"><span class="nb-ico">🍽️</span><span class="nb-lbl">Cardápio</span></button>
  <button class="nb" onclick="switchTab('receitas',this)"><span class="nb-ico">🍳</span><span class="nb-lbl">Receitas</span></button>
  <button class="nb" onclick="switchTab('agua',this)"><span class="nb-ico">💧</span><span class="nb-lbl">Água</span></button>
  <button class="nb" onclick="switchTab('suplementos',this)"><span class="nb-ico">💊</span><span class="nb-lbl">Suplementos</span></button>
  <button class="nb" onclick="switchTab('regras',this)"><span class="nb-ico">📋</span><span class="nb-lbl">Guia</span></button>
</nav>
</div>

<script>
// ═══════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════
const DAYS_SHORT = ['SEG','TER','QUA','QUI','SEX','SÁB','DOM'];

const JUDO = [1,3]; // TER=1, QUI=3

// ── PADRÃO A: Segunda / Quinta (dias de judô) ──

  tarde:{

function jsToOur(jsDay){ return jsDay===0?6:jsDay-1 }

// TAB SWITCH
// ═══════════════════════════════════════════════
function switchTab(name, btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  btn.classList.add('active');
}

// ═══════════════════════════════════════════════
// MEAL CARD TOGGLE
// ═══════════════════════════════════════════════
function toggleMeal(id){
  const el = document.getElementById(id);
  el.classList.toggle('open');
}
function toggleSubs(id){
  const panel = document.getElementById(id);
  panel.classList.toggle('open');
}

// ═══════════════════════════════════════════════
// RENDER MEALS
// ═══════════════════════════════════════════════
function renderDay(dayIdx){
  currentDay = dayIdx;
  const isJudo = JUDO.includes(dayIdx);
  const pattern = PATTERN_MAP[dayIdx];
  const dayFull = DAYS_FULL[dayIdx];

  // Update day buttons
  document.querySelectorAll('.day-btn').forEach((b,i)=>{
    b.classList.toggle('active', i===dayIdx);
  });

  // Judo badge in header
  const badge = document.getElementById('judo-badge');
  badge.textContent = isJudo ? '🥋 Dia de Judô' : '';

  // Hero
  const hero = document.getElementById('day-hero');
  hero.innerHTML = `
    <div class="day-hero">
      <div class="day-hero-name">${dayFull}</div>
      <div class="day-hero-sub">${isJudo ? '5 refeições · Meta hídrica 2,5 L' : '5 refeições · Meta hídrica 2,0 L'}</div>
      ${isJudo ? '<div class="judo-chip">🥋 Judô hoje &mdash; lanche da tarde vai porcionado na lancheira</div>' : ''}
    </div>
  `;

  // Meals
  const types = ['cafe','lancheira','almoco','tarde','jantar'];
  const typeClasses = ['cafe','lancheira','almoco','tarde','jantar'];
  const container = document.getElementById('meals-container');

  let html = '<div class="sec-lbl">Refeições do dia</div>';

  types.forEach((t, ti) => {
    const meal = pattern[t];
    const cardId = `mc-${t}`;
    const subsId = `subs-${t}`;
    const cls = typeClasses[ti];

    const foodsHtml = meal.foods.map(f=>`
      <li class="food-item">
        <span class="food-bullet">·</span>
        <span>${f.n}</span>
        <span class="food-qty">${f.q}</span>
      </li>`).join('');

    const subsHtml = meal.subs.length ? meal.subs.map(s=>`
      <div class="sub-group">
        <div class="sub-lbl">Substituir ${s.l}</div>
        ${s.s.map(i=>`<div class="sub-item">${i}</div>`).join('')}
      </div>`).join('') : '';

    const saladaHtml = meal.salada ? `
      <div class="salada-box">
        <strong>Sugestão de salada</strong>
        ${meal.salada}
      </div>` : '';

    html += `
      <div class="mc ${cls}" id="${cardId}">
        <div class="mc-hdr" onclick="toggleMeal('${cardId}')">
          <div class="mc-bar"></div>
          <div class="mc-ico">${meal.icon}</div>
          <div class="mc-info">
            <div class="mc-time">${meal.time}</div>
            <div class="mc-name">${meal.name}</div>
          </div>
          <div class="mc-chevron">⌄</div>
        </div>
        <div class="mc-body">
          ${saladaHtml}
          <ul class="food-list">${foodsHtml}</ul>
          ${subsHtml ? `
            <button class="subs-toggle" onclick="toggleSubs('${subsId}')">⇄ Ver substituições</button>
            <div class="subs-panel" id="${subsId}">${subsHtml}</div>
          ` : ''}
          ${meal.dica ? `
            <div class="dica">
              <div class="dica-lbl">💡 Dica</div>
              <div class="dica-txt">${meal.dica}</div>
            </div>` : ''}
        </div>
      </div>`;
  });

  container.innerHTML = html;
}

// RENDER ÁGUA
// ═══════════════════════════════════════════════
async function renderAgua(){
  const body = document.getElementById('agua-body');
  // Auto-detect judô day
  const todayIdx = jsToOur(new Date().getDay());
  const autoJudo = JUDO.includes(todayIdx);

  // Load stored water
  const today = new Date().toISOString().split('T')[0];
  try {
    const res = await window.storage.get('isabela-water');
    if(res){
      const d = JSON.parse(res.value);
      if(d.date===today){
        waterCount = d.count;
        waterMode = d.mode || (autoJudo?'judo':'normal');
      } else {
        waterCount = 0;
        waterMode = autoJudo?'judo':'normal';
      }
    } else {
      waterMode = autoJudo?'judo':'normal';
    }
  } catch(e){ waterMode = autoJudo?'judo':'normal'; }

  rebuildAgua();
}

function rebuildAgua(){
  const goal = waterMode==='judo' ? 2.5 : 2.0;
  const totalGlasses = waterMode==='judo' ? 12 : 10;
  const mlPerGlass = (goal*1000)/totalGlasses;
  const pct = Math.min(100, Math.round((waterCount/totalGlasses)*100));

  const glassesHtml = Array.from({length:totalGlasses},(_,i)=>`
    <div class="glass ${i<waterCount?'':'empty'}" onclick="tapGlass(${i})">
      <span class="glass-ico">💧</span>
      <span class="glass-ml">${Math.round(mlPerGlass)}ml</span>
    </div>`).join('');

  const consumed = Math.round((waterCount/totalGlasses)*goal*1000);
  const tips = {
    normal:[
      '💡 Ao acordar (7h): tomar 1 copo antes do café da manhã.',
      '🌅 Antes do almoço: mais 2 copos entre o lanche e o almoço.',
      '☀️ Tarde: 3 copos ao longo do lanche da tarde até antes do jantar.',
      '🌙 Noite: completar a meta após o jantar – não tomar tudo de uma vez.',
    ],
    judo:[
      '💡 Ao acordar (7h): 1 copo antes do café da manhã.',
      '🥋 Antes do judô: 1 copo extra 30 min antes do treino.',
      '🏋️ Durante e após o judô: pelo menos 2 copos para repor o suor.',
      '🌙 Distribuir o restante ao longo da tarde e noite.',
    ],
  };
  const tip = tips[waterMode][Math.min(3, Math.floor(waterCount/3))];

  document.getElementById('agua-body').innerHTML = `
    <div class="agua-toggle">
      <button class="agua-btn${waterMode==='normal'?' active':''}" onclick="setWaterMode('normal')">Dia normal<br><span style="font-size:11px;font-weight:400">2,0 L</span></button>
      <button class="agua-btn${waterMode==='judo'?' active':''}" onclick="setWaterMode('judo')">Dia de judô 🥋<br><span style="font-size:11px;font-weight:400">2,5 L</span></button>
    </div>
    <div class="agua-goal">
      <div><span class="agua-num">${(goal).toFixed(1)}</span><span class="agua-unit"> L</span></div>
      <div class="agua-lbl">Meta do dia · ${consumed}ml de ${goal*1000}ml</div>
    </div>
    <div class="glasses-grid" id="glasses-grid">${glassesHtml}</div>
    <div class="agua-bar-wrap"><div class="agua-bar" style="width:${pct}%"></div></div>
    <div class="agua-counter">${waterCount} de ${totalGlasses} copos (${pct}%)</div>
    <div class="agua-tip">${tip}</div>
    <button class="agua-reset" onclick="resetWater()">↺ Zerar o contador</button>
  `;
}

async function tapGlass(idx){
  waterCount = (idx < waterCount) ? idx : idx+1;
  const today = new Date().toISOString().split('T')[0];
  try{ await window.storage.set('isabela-water', JSON.stringify({date:today,count:waterCount,mode:waterMode})); }catch(e){}
  rebuildAgua();
}

async function setWaterMode(mode){
  waterMode = mode;
  waterCount = 0;
  const today = new Date().toISOString().split('T')[0];
  try{ await window.storage.set('isabela-water', JSON.stringify({date:today,count:0,mode})); }catch(e){}
  rebuildAgua();
}

async function resetWater(){
  waterCount = 0;
  const today = new Date().toISOString().split('T')[0];
  try{ await window.storage.set('isabela-water', JSON.stringify({date:today,count:0,mode:waterMode})); }catch(e){}
  rebuildAgua();
}
